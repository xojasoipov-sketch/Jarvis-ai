# Railway deploy GitHub integration orqali avtomatik ishlaydi.
# Railway dashboard: Project → Settings → Source → GitHub repo + branch (main)
# Har push da Railway o‘zi build + deploy qiladi.
#
# Bu workflow faqat CI tekshiruvi uchun (ixtiyoriy).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev || npm install --include=dev

      - name: Lint
        run: npm run lint || true

      - name: Build
        run: npm run build
        env:
          # Build vaqtida env yo‘q bo‘lsa ham o‘tishi uchun dummy
          GEMINI_API_KEY: "build-placeholder"
          NEXT_TELEMETRY_DISABLED: "1"
