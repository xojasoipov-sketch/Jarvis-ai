name: Build Android APK

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - 'android-agent/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Release yaratish uchun yozish huquqi kerak
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android-agent

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android-agent/**/*.gradle.kts', 'android-agent/**/libs.versions.toml') }}
          restore-keys: gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        env:
          JARVIS_SERVER_URL: ${{ secrets.JARVIS_SERVER_URL }}
          JARVIS_AUTO_PAIR_KEY: ${{ secrets.JARVIS_AUTO_PAIR_KEY }}
          JARVIS_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-agent-debug-${{ github.sha }}
          path: android-agent/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: APK info
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          echo "APK size: $(du -sh $APK | cut -f1)"
          echo "SHA256: $(sha256sum $APK)"

      # Release sifatida chiqaramiz — ochiq (autentifikatsiyasiz) yuklab olish
      # havolasi bo'ladi, ilova shu orqali o'zini avtomatik yangilaydi.
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" \
            app/build/outputs/apk/debug/app-debug.apk \
            --repo "${{ github.repository }}" \
            --title "Jarvis Agent v1.0.${{ github.run_number }}" \
            --notes "Avtomatik build — commit ${{ github.sha }}" \
            --latest
