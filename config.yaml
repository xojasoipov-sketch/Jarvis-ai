# ~/.hermes/config.yaml
# Bu faylni ko'chirib, o'z Hermes o'rnatmangizdagi ~/.hermes/config.yaml ga qo'ying
# (yoki mavjud config.yaml ichiga shu bo'limlarni qo'shing).
#
# MUHIM: bu faylda hech qanday token/parol YOZILMAYDI.
# Barcha maxfiy qiymatlar ${ENV_VAR} orqali ~/.hermes/.env fayldan o'qiladi.

# ---------------------------------------------------------------------------
# 1) MCP SERVERLAR
# ---------------------------------------------------------------------------
mcp_servers:

  # --- Obsidian: xotira/bilim bazasi ---
  # Vault yo'lini .env orqali beriladi (OBSIDIAN_VAULT_PATH)
  obsidian:
    command: "npx"
    args:
      - "-y"
      - "obsidian-mcp"
      - "${OBSIDIAN_VAULT_PATH}"
    tools:
      exclude: []
    enabled: true

  # --- Telefon (iOS + Android) boshqaruvi ---
  # Bitta MCP ikkala platformani ham qamrab oladi: skrin o'qish, tugmalar bosish,
  # ilova ochish, matn kiritish va h.k. Android uchun ADB, iOS uchun go-ios kerak
  # (README'dagi 6-bo'limga qarang).
  mobile:
    command: "npx"
    args:
      - "-y"
      - "@mobilenext/mobile-mcp@latest"
    enabled: true
    tools:
      # Xavfli/halokatli amallarni istasangiz shu yerda cheklang, masalan:
      # exclude: [mobile_uninstall_app]
      exclude: []

  # (IXTIYORIY) Kompyuterni boshqarish uchun ALOHIDA MCP kerak EMAS —
  # Hermes'da bu built-in `computer_use` toolset sifatida mavjud.
  # Yoqish uchun: `hermes tools` -> Computer Use -> Enable
  # (macOS/Windows/Linux, cua-driver orqali ishlaydi).

# ---------------------------------------------------------------------------
# 2) SPEECH-TO-TEXT (STT) — lokal asosiy, pullik zaxira
# ---------------------------------------------------------------------------
# "local" — faster-whisper orqali kompyuteringizda ishlaydi, internetga
# bog'liq emas, hech qanday API kalit talab qilmaydi.
# Agar lokal model mavjud bo'lmasa/xato bersa, Hermes avtomatik ravishda
# .env'dagi GROQ_API_KEY / VOICE_TOOLS_OPENAI_KEY orqali bulutli zaxiraga
# o'tadi (priority chain: Local > Groq > OpenAI > Mistral > xAI > ElevenLabs).
stt:
  provider: "local"
  local:
    model: "base"   # tiny | base | small | medium | large-v3
    # Aniqlik kerak bo'lsa "small" yoki "medium"ga o'ting (sekinroq, aniqroq)

# ---------------------------------------------------------------------------
# 3) TEXT-TO-SPEECH (TTS) — lokal asosiy, pullik zaxira
# ---------------------------------------------------------------------------
# "piper" — to'liq offline, API kalit kerak emas, ~20-90MB model.
# Sifat muhim bo'lganda ElevenLabs'ga qo'lda o'tkazish mumkin (pastga qarang).
tts:
  provider: "piper"
  piper:
    voice: "en_US-lessac-medium"   # boshqa tillar/ovozlar uchun hujjatga qarang
  speed: 1.0

# Sifatli ovoz kerak bo'lganda (masalan uzun javoblar, muhim eslatmalar):
# tts:
#   provider: "elevenlabs"
# (ELEVENLABS_API_KEY .env'da bo'lishi kerak)

# ---------------------------------------------------------------------------
# 4) TERMINAL / KOD YOZISH ("vibe coding") — Claude Code/Cursor/Codex kabi
# ---------------------------------------------------------------------------
# Hermes'da terminal, fayl o'qish/yozish/tahrirlash va execute_code
# BUILT-IN — alohida MCP shart emas. "local" backend = to'g'ridan-to'g'ri
# sizning kompyuteringizda ishlaydi (to'liq huquq bilan).
#
# ⚠️ Bu Jarvisga kompyuteringizda buyruq bajarish huquqini beradi.
# Agar ishonchni asta-sekin oshirmoqchi bo'lsangiz, backend: "docker" bilan
# boshlang (izolyatsiyalangan konteyner) va tayyor bo'lgach "local"ga o'ting.
terminal:
  backend: "local"   # local | docker | ssh | modal | daytona | singularity
  persistent_shell: true

# ---------------------------------------------------------------------------
# 5) TELEGRAM GATEWAY
# ---------------------------------------------------------------------------
gateway:
  platforms:
    telegram:
      home_chat_id: "${TELEGRAM_ALLOWED_USERS}"
      gateway_restart_notification: true
      typing_indicator: true

display:
  tool_progress: "new"   # off | new | all | verbose

# ---------------------------------------------------------------------------
# 6) (IXTIYORIY) Kontekst fayli — Jarvis o'zini qanday tutishini bilishi uchun
# ---------------------------------------------------------------------------
# ~/.hermes/AGENTS.md faylida quyidagi kabi ko'rsatma qoldiring:
#
# # Rol
# Sen mening shaxsiy Jarvis-yordamchimsan.
# - Obsidian vault'im — mening xotiram: undan qidir, unga yoz.
# - Kompyuterim va telefonimni boshqarish huquqing bor — lekin har doim
#   halokatli amallar (o'chirish, pul to'lash, xabar yuborish) oldidan
#   avval tasdiqlashimni so'ra.
# - Kod yozganda avval reja tuz, keyin bajarishga o't.
